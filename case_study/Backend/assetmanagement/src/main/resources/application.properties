spring.application.name=assetmanagement
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/asset_management_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:HexawareAssetMgmtDefaultSecretKeyForDevOnly12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.root=INFO
logging.level.hexaware.casestudy=DEBUG
logging.level.org.springframework.security=WARN